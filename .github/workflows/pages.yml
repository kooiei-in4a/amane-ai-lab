name: Deploy GitHub Pages

# Builds and validates the static site on pull requests. Deploys only from main.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build site (first pass)
        run: python scripts/build_site.py

      - name: Sync generated site on PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git add articles data index.html sitemap.xml feed.xml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: sync generated site"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Fail on generated drift
        shell: bash
        run: |
          changes="$(git status --porcelain=v1 --untracked-files=all -- articles data index.html sitemap.xml feed.xml)"
          if [[ -n "$changes" ]]; then
            echo "Generated files are out of date. Refusing to assemble a Pages artifact."
            printf '%s\n' "$changes"
            git --no-pager diff -- articles data index.html sitemap.xml feed.xml
            exit 1
          fi

      - name: Build site (idempotency pass)
        run: python scripts/build_site.py

      - name: Fail on non-idempotent generation
        shell: bash
        run: |
          changes="$(git status --porcelain=v1 --untracked-files=all -- articles data index.html sitemap.xml feed.xml)"
          if [[ -n "$changes" ]]; then
            echo "A second build changed generated files. Refusing to assemble a Pages artifact."
            printf '%s\n' "$changes"
            git --no-pager diff -- articles data index.html sitemap.xml feed.xml
            exit 1
          fi

      - name: Validate content
        run: python scripts/validate_content.py

      - name: Sensitive data check
        run: python scripts/check_sensitive_data.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Assemble public tree
        run: |
          mkdir -p _site
          cp -R articles assets benchmarks data index.html sitemap.xml feed.xml .nojekyll _site/
          # Optional root documents for transparency.
          cp README.md LICENSE LICENSE-CONTENT _site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
