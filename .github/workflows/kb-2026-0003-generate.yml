name: Generate KB-2026-0003 artifacts

on:
  pull_request:
    paths:
      - "content/articles/2026/kb-2026-0003-llm-review-benchmark/**"
      - ".github/workflows/kb-2026-0003-generate.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_site.py
      - run: python scripts/validate_content.py
      - run: python scripts/check_sensitive_data.py
      - run: python -m unittest discover -s tests -v
      - name: Commit generated files and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/kb-2026-0003-generate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles data index.html sitemap.xml feed.xml .github/workflows/kb-2026-0003-generate.yml
          git commit -m "build: generate KB-2026-0003 site artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
