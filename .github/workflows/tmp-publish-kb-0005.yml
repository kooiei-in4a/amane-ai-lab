name: Temporary Publish KB-0005

on:
  push:
    branches:
      - agent/kb-2026-0005-fnd-model-implementation-benchmark

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kb-2026-0005-fnd-model-implementation-benchmark

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build generated site files
        run: python scripts/build_site.py

      - name: Validate content
        run: python scripts/validate_content.py

      - name: Sensitive data check
        run: python scripts/check_sensitive_data.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles data index.html sitemap.xml feed.xml
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'build: publish KB-2026-0005 site artifacts'
            git push origin HEAD:agent/kb-2026-0005-fnd-model-implementation-benchmark
          fi
