name: Generate KB-2026-0003 artifacts

on:
  pull_request:
    paths:
      - "content/articles/2026/kb-2026-0003-llm-review-benchmark/**"
      - ".github/workflows/kb-2026-0003-generate.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_site.py
      - run: python scripts/validate_content.py
      - run: python scripts/check_sensitive_data.py
      - run: python -m unittest discover -s tests -v
      - name: Package generated files
        run: |
          mkdir -p _generated/articles/2026
          cp -R articles/2026/kb-2026-0003-llm-review-benchmark _generated/articles/2026/
          mkdir -p _generated/data
          cp data/articles.json data/tags.json _generated/data/
          cp index.html sitemap.xml feed.xml _generated/
      - uses: actions/upload-artifact@v4
        with:
          name: kb-2026-0003-generated
          path: _generated
          if-no-files-found: error
