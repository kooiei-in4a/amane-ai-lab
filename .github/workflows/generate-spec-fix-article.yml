name: Generate spec-fix article

on:
  push:
    branches:
      - agent/spec-fix-001-article

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spec-fix-001-article
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_site.py
      - name: Commit generated files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles data index.html sitemap.xml feed.xml
          git rm .github/workflows/generate-spec-fix-article.yml
          git commit -m "Generate specification fix benchmark article"
          git push origin HEAD:agent/spec-fix-001-article
