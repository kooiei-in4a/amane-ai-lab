name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build site (first pass)
        run: python scripts/build_site.py

      - name: Fail on generated drift
        shell: bash
        run: |
          changes="$(git status --porcelain=v1 --untracked-files=all -- articles data index.html sitemap.xml feed.xml)"
          if [[ -n "$changes" ]]; then
            echo "Generated files are out of date. Run scripts/build_site.py and commit all generated changes."
            printf '%s\n' "$changes"
            git --no-pager diff -- articles data index.html sitemap.xml feed.xml
            exit 1
          fi

      - name: Build site (idempotency pass)
        run: python scripts/build_site.py

      - name: Fail on non-idempotent generation
        shell: bash
        run: |
          changes="$(git status --porcelain=v1 --untracked-files=all -- articles data index.html sitemap.xml feed.xml)"
          if [[ -n "$changes" ]]; then
            echo "A second build changed generated files. Generation is not idempotent."
            printf '%s\n' "$changes"
            git --no-pager diff -- articles data index.html sitemap.xml feed.xml
            exit 1
          fi

      - name: Validate content
        run: python scripts/validate_content.py

      - name: Sensitive data check
        run: python scripts/check_sensitive_data.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Internal link presence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          index = json.loads((root/'data'/'articles.json').read_text(encoding='utf-8'))
          missing = []
          for a in index['articles']:
              target = root / a['url'].lstrip('/') / 'index.html'
              if not target.exists():
                  missing.append(str(target))
          if missing:
              raise SystemExit('missing pages: ' + ', '.join(missing))
          print('internal links ok', len(index['articles']))
          PY
