<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SITE_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{SITE_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{OG_URL}}">
  <meta property="og:site_name" content="{{SITE_NAME}}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{SITE_TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <link rel="stylesheet" href="{{ASSET_PREFIX}}/assets/css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へスキップ</a>
  <header class="site-header">
    <div class="wrap">
      <p class="brand"><a href="./">{{SITE_NAME}}</a></p>
      <nav aria-label="サイト">
        <a href="./">記事一覧</a>
        <a href="{{REPO_URL}}">GitHub</a>
        <a href="./feed.xml">Feed</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap home-page">
    <section class="home-intro">
      <h1>{{SITE_NAME}}</h1>
      <p class="lede">{{DESCRIPTION}}</p>
      <p class="count">公開対象を含む記事: <strong id="article-count">{{ARTICLE_COUNT}}</strong> 件</p>
    </section>

    <section class="filters panel" aria-labelledby="filter-heading">
      <h2 id="filter-heading">絞り込み</h2>
      <div class="filter-grid">
        <label>
          キーワード
          <input type="search" id="filter-keyword" placeholder="タイトル・説明・ID" autocomplete="off">
        </label>
        <label>
          タグ
          <select id="filter-tag">
            <option value="">すべて</option>
          </select>
        </label>
        <label>
          AIエージェント
          <select id="filter-agent">
            <option value="">すべて</option>
          </select>
        </label>
        <label>
          並び順
          <select id="filter-sort">
            <option value="updated">更新日順</option>
            <option value="published">公開日順</option>
          </select>
        </label>
      </div>
      <p id="filter-empty" class="note" hidden>条件に一致する記事がありません。</p>
      <noscript>
        <p class="note">JavaScriptが無効な場合、下の静的一覧のみ表示されます。絞り込みは動作しません。</p>
      </noscript>
    </section>

    <section class="panel" aria-labelledby="list-heading">
      <h2 id="list-heading">記事一覧</h2>
      <ul id="article-list" class="article-list" data-source="./data/articles.json"></ul>
      <p id="list-fallback" class="note">記事一覧を読み込み中です。失敗した場合は <a href="./data/articles.json">articles.json</a> を直接確認してください。</p>
    </section>
  </main>

  <footer class="site-footer wrap">
    <p><a href="{{REPO_URL}}">GitHubリポジトリ</a> · コード MIT / コンテンツ CC BY 4.0</p>
  </footer>

  <script src="{{ASSET_PREFIX}}/assets/js/site.js" defer></script>
</body>
</html>
