name: Generate KB-0004 Japanese artifacts
on:
  push:
    branches:
      - agent/kb-0004-japanese-terms
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kb-0004-japanese-terms
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_site.py
      - name: Commit generated artifacts and remove temporary workflow
        run: |
          rm .github/workflows/generate-kb-0004-japanese.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles data index.html sitemap.xml feed.xml .github/workflows/generate-kb-0004-japanese.yml
          git commit -m "build: regenerate KB-2026-0004 Japanese artifacts"
          git push origin HEAD:agent/kb-0004-japanese-terms
