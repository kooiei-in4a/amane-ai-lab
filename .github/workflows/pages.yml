name: Deploy GitHub Pages

# Builds and validates the static site on pull requests. Deploys only from main.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build site
        run: python scripts/build_site.py

      - name: Validate content
        run: python scripts/validate_content.py

      - name: Sensitive data check
        run: python scripts/check_sensitive_data.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Commit generated files to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles data index.html sitemap.xml feed.xml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "KB-2026-0011: update generated site"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Assemble public tree
        run: |
          mkdir -p _site
          cp -R articles assets benchmarks data index.html sitemap.xml feed.xml .nojekyll _site/
          cp README.md LICENSE LICENSE-CONTENT _site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
